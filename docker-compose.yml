services:
  postgres:
    image: pgvector/pgvector:pg16
    ports: ["5433:5432"]
    environment:
      POSTGRES_USER: bussola
      POSTGRES_PASSWORD: bussola
      POSTGRES_DB: bussola
    volumes: ["bussola-v1-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bussola"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: python:3.12-slim
    working_dir: /app
    volumes: ["./backend:/app"]
    command: sh -c "pip install -r requirements.txt -q && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://bussola:bussola@postgres:5432/bussola
      JWT_SECRET: change-me-before-production
      # Set your key: export OPENAI_API_KEY=sk-... && docker compose up
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-gpt-4o-mini}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  bussola-v1-postgres:
