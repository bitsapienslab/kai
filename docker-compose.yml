services:
  postgres:
    image: pgvector/pgvector:pg16
    ports: ["5433:5432"]
    environment:
      POSTGRES_USER: bussola
      POSTGRES_PASSWORD: bussola
      POSTGRES_DB: bussola
    volumes: ["bussola-v1-postgres:/var/lib/postgresql/data"]
  api:
    image: python:3.12-slim
    working_dir: /app
    volumes: ["./backend:/app"]
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://bussola:bussola@postgres:5432/bussola
      JWT_SECRET: change-me-before-production
    depends_on: [postgres]
volumes:
  bussola-v1-postgres:
